<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gekota 实时播放</title>
<link rel="stylesheet" href="player.css">
</head>
<body>
<div id="app">
  <section id="stage">
    <video id="player" playsinline preload="metadata"></video>
    <div id="danmaku-layer"></div>

    <div id="stage-top">
      <button id="back" type="button" title="返回监控室">‹</button>
      <div id="room-title">直播中</div>
      <div id="stage-state">连接中…</div>
    </div>

    <div id="stage-empty" hidden>
      <div class="empty-title">正在连接直播流…</div>
      <div class="empty-sub" id="empty-sub">如果长时间没有画面，会在几秒后重试</div>
      <button id="retry" type="button">立即重试</button>
    </div>

    <div id="stage-ctrl">
      <button id="play" type="button" title="播放 / 暂停">▶</button>
      <button id="mute" type="button" title="静音">🔊</button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1" title="音量">
      <span id="live-dot"></span><span id="live-label">LIVE</span>
      <select id="quality" title="画质" aria-label="画质"></select>
      <span id="spacer"></span>
      <div id="stage-actions">
        <button type="button" data-action="folder" title="打开录制文件夹">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l1.8 2h9.2v9.5a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19V9a1.5 1.5 0 0 1 .5-1.5Z"/><path d="M3.5 9.5h17"/></svg>
        </button>
        <button type="button" data-action="capture" title="拍照（捕捉当前帧）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.4-2h7.2l1.4 2h3a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18v-8A1.5 1.5 0 0 1 4 8.5Z"/><circle cx="12" cy="13.8" r="3.4"/></svg>
        </button>
        <button type="button" data-action="clip" title="剪切当前片段">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="7" r="2.6"/><circle cx="6.5" cy="17" r="2.6"/><path d="M8.7 8.6 20 18M8.7 15.4 20 6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <aside id="chat">
    <header>
      <div>
        <b>实时弹幕</b>
        <span id="chat-state">连接中…</span>
      </div>
      <span id="login-state" class="muted">未登录</span>
    </header>
    <div id="chat-tools">
      <button id="toggle-fly" type="button" class="on">飞屏</button>
      <button id="toggle-scroll" type="button" class="on">自动滚动</button>
      <button id="dm-settings" type="button">弹幕设置</button>
      <button id="clear-chat" type="button">清屏</button>
    </div>
    <div id="dm-panel" hidden>
      <div class="dm-presets">
        <button type="button" data-preset="simple">简洁</button>
        <button type="button" data-preset="bright">高亮</button>
        <button type="button" data-preset="nofly">关闭飞屏</button>
      </div>
      <label>字号 <input id="dm-size" type="range" min="16" max="34" step="1" value="22"></label>
      <label>不透明度 <input id="dm-opacity" type="range" min="20" max="100" step="5" value="100"></label>
      <label>滚动时长 <input id="dm-speed" type="range" min="6" max="16" step="1" value="9"></label>
      <label>显示区域
        <select id="dm-area">
          <option value="full">全屏</option>
          <option value="top">上半屏</option>
          <option value="bottom">下半屏</option>
        </select>
      </label>
      <label>颜色
        <select id="dm-color">
          <option value="#ffffff">白色</option>
          <option value="#ffe066">黄色</option>
          <option value="#7fe7ff">青色</option>
          <option value="#ff9ec7">粉色</option>
          <option value="#9cff9c">绿色</option>
        </select>
      </label>
      <label>描边
        <select id="dm-stroke">
          <option value="1">开</option>
          <option value="0">关</option>
        </select>
      </label>
    </div>
    <div id="chat-list"></div>
    <div id="chat-compose">
      <input id="chat-input" maxlength="30" placeholder="发一条弹幕…" autocomplete="off">
      <button id="send" type="button">发送</button>
    </div>
    <div id="send-state"></div>
  </aside>
</div>
<script src="mpegts.js"></script>
<script src="player.js"></script>
</body>
</html>
